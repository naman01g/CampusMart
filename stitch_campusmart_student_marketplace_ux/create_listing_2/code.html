<body class="h-full font-body-md text-on-background antialiased flex flex-col md:hidden">
<!-- Top App Bar (Transactional / Linear flow context - modified for flow) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-gutter h-16 bg-background border-b border-outline-variant">
<button aria-label="Cancel listing" class="text-primary p-2 -ml-2">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<span class="font-title-lg text-title-lg text-primary tracking-tight">Create Listing</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow pt-16 pb-24 px-4 flex flex-col">
<!-- Progress Indicator -->
<div class="flex items-center gap-2 my-md">
<div class="h-1 flex-1 bg-ochre rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-sm mb-lg">Show students what you're listing</h1>
<!-- Photo Upload Section -->
<div class="mb-xl">
<div class="flex justify-between items-end mb-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Photos</label>
<span class="font-body-md text-body-md text-on-surface-variant">1/10</span>
</div>
<div class="grid grid-cols-2 gap-sm">
<!-- Uploaded Photo (Realistic Placeholder) -->
<div class="aspect-square relative rounded border border-outline-variant overflow-hidden group">
<img class="w-full h-full object-cover" data-alt="A brightly lit, top-down photograph of a college biology textbook resting on a clean, light wood desk. The lighting is natural and even, highlighting the cover details. The aesthetic is clean, modern, and trustworthy, suitable for a university marketplace." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8JisMJ2aHAZqy9diwULFTQjv5hIOYyN1GcJ4aEt7RtzG7uoG3lIABveJR2lhsSSgqARH0kbgpTqiPFb87_NwJJK1QMGzfOUcIvr0ZeoTVdjk1Mx5QvQhutOaLUgmol0B_8Hl7s0QWWCqhyVZsEGGYPL17FvtburZWclEIp2-mCJr_eCKua8Nb9wMjCbJMRgpd-AfK-MDQTQ9QYSqUlftmZA8BU_fSqxSrgLf-Ld2D2INGxIq7Gxc"/>
<button class="absolute top-2 right-2 bg-surface-container-lowest/80 rounded p-1 shadow-sm opacity-90">
<span class="material-symbols-outlined text-on-surface text-sm">close</span>
</button>
</div>
<!-- Upload Area -->
<button class="aspect-square rounded border border-dashed border-outline bg-surface flex flex-col items-center justify-center text-on-surface-variant hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl mb-1">add_photo_alternate</span>
<span class="font-label-sm text-label-sm">Add Photo</span>
</button>
</div>
</div>
<!-- Details Section -->
<div class="flex flex-col gap-lg">
<!-- Title Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="listing-title">Listing Title</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary transition-colors" id="listing-title" placeholder="What are you selling?" type="text"/>
</div>
<!-- Category Select -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="listing-category">Category</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary transition-colors" id="listing-category">
<option disabled="" selected="" value="">Select a category</option>
<option value="textbooks">Textbooks &amp; Notes</option>
<option value="electronics">Electronics</option>
<option value="furniture">Dorm Furniture</option>
<option value="clothing">Clothing</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Condition Chips -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Condition</label>
<div class="flex flex-wrap gap-sm">
<button class="px-3 py-1.5 border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">New</button>
<button class="px-3 py-1.5 border border-primary rounded bg-primary-container font-body-md text-body-md text-on-primary focus:outline-none">Like New</button>
<button class="px-3 py-1.5 border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">Good</button>
<button class="px-3 py-1.5 border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">Fair</button>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="listing-desc">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded p-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary transition-colors resize-none" id="listing-desc" placeholder="Describe the item, flaws, reasons for selling..." rows="4"></textarea>
</div>
</div>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant p-4 pb-safe flex justify-end z-50 shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<button class="w-full py-3 bg-[#E38F2D] text-on-primary font-title-lg text-title-lg rounded border border-[#E38F2D] active:opacity-80 transition-opacity flex items-center justify-center gap-2">
            Next Step
            <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
</button>
</div>
</body></html>
